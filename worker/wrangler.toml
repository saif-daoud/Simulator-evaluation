[vars]
ALLOWED_ORIGINS = "https://saif-daoud.github.io,http://localhost:5500,http://127.0.0.1:5500"
PARTICIPANT_CODES = "EXPERT-0001,EXPERT-0002"
PROFILE_ASSIGNMENTS = "EXPERT-0001:1-20,EXPERT-0002:21-40"
OPENAI_MODEL = "gpt-5.1"
OPENAI_BASE_URL = "https://qcri-sakina.services.ai.azure.com/openai/v1"
